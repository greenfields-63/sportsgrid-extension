<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { width: 240px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1e1e22; color: #fff; margin: 0; padding: 14px; }
        h2 { font-size: 14px; margin-bottom: 10px; font-weight: 600; text-align: center; }
        .sound-btn { width: 100%; padding: 10px; background: #27272a; color: #fff; border: 1px solid #3f3f46; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 12px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        .sound-btn:hover { background: #3f3f46; border-color: #3b82f6; }
        .sound-btn.active { background: #3b82f6; border-color: #60a5fa; }
    </style>
</head>
<body>
    <h2>Quick Audio Switch</h2>
    <div id="sound-list"></div>
    <script src="sound.js"></script>
</body>
</html>
